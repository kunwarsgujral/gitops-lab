nameOverride: ""
fullnameOverride: ""
replicaCount: 1 # only used when keda.enabled=false; otherwise KEDA/HPA owns replicas
image:
  repository: ghcr.io/kunwarsgujral/demo-app
  tag: 921fbc6 # CI overwrites this with the short git SHA on every merge to main
  pullPolicy: IfNotPresent
# Failure injection for alerting drills. Change these in Git, push, and watch the alerts fire.
app:
  errorRate: "0" # e.g. "0.2" = 20% of requests return HTTP 500
  extraLatencyMs: "0" # e.g. "1500" = up to 1.5s extra latency per request
service:
  port: 80
  targetPort: 8080
# Required by the Kyverno policies in platform/kyverno-policies (require-requests-limits).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
# Required by the require-non-root policy. The image already runs as UID 10001 (see app/Dockerfile).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
# Secrets pulled from the secret backend by External Secrets Operator.
externalSecret:
  enabled: true
  storeName: lab-store
  storeKind: ClusterSecretStore
  refreshInterval: 1m
  data:
    - secretKey: API_KEY
      remoteKey: /demo/api-key
serviceMonitor:
  enabled: true
  interval: 15s
# Recording rules + alerts (templates/prometheusrule.yaml).
alerts:
  enabled: true
  # Availability SLO 99.9% => error budget 0.1%. Burn-rate alerts are multiples of this.
  errorBudget: 0.001
  latencyP95Seconds: 0.5
  runbookBaseUrl: https://github.com/kunwarsgujral/gitops-lab/blob/main/docs/runbooks/demo-app.md
# Grafana dashboard shipped as a ConfigMap; the Grafana sidecar loads it (templates/grafana-dashboard.yaml).
grafanaDashboard:
  enabled: true
# Argo CD hooks (see templates/hooks.yaml).
# Hook Jobs run in the same namespace, so they must pass the same Kyverno policies and fit the quota.
hooks:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534 # "nobody": busybox and curl images default to root or a non-numeric user
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  preSyncMigration:
    enabled: false # example only; turn on to watch PreSync ordering
    image: busybox:1.36
  smokeTest:
    enabled: true
    image: busybox:1.36
  syncFailNotify:
    enabled: true
    image: curlimages/curl:8.10.1
keda:
  enabled: true
  minReplicaCount: 1 # set 0 for scale-to-zero (needs an HTTP add-on or a different trigger to wake up)
  maxReplicaCount: 8
  pollingInterval: 15
  cooldownPeriod: 60 # only for 1 -> 0; N -> 1 follows the HPA's 5-minute default stabilization window
  prometheus:
    serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
    # Total request rate across all demo-app pods.
    query: sum(rate(demo_app_http_requests_total{namespace="demo"}[1m]))
    # AverageValue semantics: desired replicas = ceil(query result / threshold).
    threshold: "20"

# LAB ONLY: the Fake provider keeps "secret" values in the store spec itself, so they sit in Git.
# That is fine for practice (no cloud account needed) and wrong for anything real.
# To swap in a real backend, replace this file with docs/examples/aws-secretsmanager-clustersecretstore.yaml.
# The ExternalSecrets do not change; only the store does. That is the point of ESO.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: lab-store
spec:
  provider:
    fake:
      data:
        - key: /grafana/admin-user
          value: admin
        - key: /grafana/admin-password
          value: change-me-in-the-vault
        - key: /demo/api-key
          value: demo-api-key-v1

# Sample resources for kyverno test. Namespace team-a is a tenant namespace (not in the platform skip list).
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: team-a
spec:
  containers:
  - name: c
    image: busybox:1.36
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-no-limits
  namespace: team-a
spec:

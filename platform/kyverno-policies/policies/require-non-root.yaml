# Kyverno CEL policy type (policies.kyverno.io/v1, Kyverno 1.17+). The older kyverno.io ClusterPolicy
# kind is deprecated since Kyverno 1.19, and 1.20 blocks creating new ones, so this lab uses the CEL types.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-non-root
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Require non-root and no privilege escalation
    policies.kyverno.io/description: >-
      A subset of the Pod Security Standards "restricted" profile, written as a policy so it can carry
      a custom message, run in CI and accept exceptions per workload.
spec:
  validationActions: [Deny]
  matchConstraints:
    # Matching only Pods lets Kyverno auto-generate the same check for Deployments, StatefulSets,
    # DaemonSets, Jobs and CronJobs (object.spec is rewritten to the pod template). So a bad
    # Deployment is rejected at apply time, not later when its ReplicaSet tries to create pods.
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    # Secure by default: every namespace is a tenant namespace except the platform ones listed here.
    - name: skip-platform-namespaces
      expression: "!(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease', 'local-path-storage', 'kyverno', 'argocd', 'external-secrets', 'monitoring', 'keda', 'reloader'])"
  validations:
    - expression: >-
        has(object.spec.securityContext) &&
        has(object.spec.securityContext.runAsNonRoot) &&
        object.spec.securityContext.runAsNonRoot == true
      message: "Set spec.securityContext.runAsNonRoot: true on the pod."
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false)
      message: "Set securityContext.allowPrivilegeEscalation: false on every container."

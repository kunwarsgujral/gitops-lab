# Load generator for scripts/load-test.sh. It runs in the demo namespace, so it has to satisfy the same
# Kyverno policies and quota as any workload there: pinned image, requests/limits, non-root, no escalation.
# (A plain `kubectl run --image=busybox` is now rejected by require-requests-limits and require-non-root.)
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  namespace: demo
  labels:
    app.kubernetes.io/name: loadgen
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loadgen
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          for i in 1 2 3 4 5 6 7 8; do
            ( while true; do wget -q -O- http://demo-app/ >/dev/null; done ) &
          done
          wait
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 200m
          memory: 32Mi
        limits:
          memory: 64Mi

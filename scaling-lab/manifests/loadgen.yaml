# In-cluster load generator for the NGINX HPA drill (README step 5): 16 parallel request loops
# against the Service. Running it inside the cluster avoids your laptop's port mapping becoming
# the bottleneck. Delete it to stop the load.
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  namespace: web
spec:
  restartPolicy: Never
  containers:
    - name: loadgen
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          for i in $(seq 1 16); do
            ( while true; do wget -q -O /dev/null http://web-nginx.web.svc.cluster.local/; done ) &
          done
          wait
      resources:
        requests:
          cpu: 200m
          memory: 32Mi
        limits:
          memory: 64Mi

# Helm values for the Argo CD install (used by scripts/bootstrap.sh).
configs:
  cm:
    # Argo CD does not assess Application health by default (removed in 1.8).
    # Without this, the root app treats child apps as done as soon as they exist,
    # so the sync waves in apps/ would not actually wait for ESO, KEDA, etc. to be Healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

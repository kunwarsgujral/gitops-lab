# NOT applied by Argo CD (it lives under docs/). Reference for the "real backend" interview answer.
#
# Auth options, best to worst:
#   1. EKS Pod Identity / IRSA: the ESO service account assumes an IAM role. No keys anywhere.
#   2. Static access keys in a K8s Secret (shown below as a fallback): a bootstrap secret you now have to protect.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: lab-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets # annotated with eks.amazonaws.com/role-arn for IRSA
            namespace: external-secrets
      # Fallback (static keys):
      # auth:
      #   secretRef:
      #     accessKeyIDSecretRef:
      #       name: aws-creds
      #       key: access-key
      #       namespace: external-secrets
      #     secretAccessKeySecretRef:
      #       name: aws-creds
      #       key: secret-access-key
      #       namespace: external-secrets
---
# Example: pull every key of one JSON secret ("prod/demo-app") into a single K8s Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app-all-keys
  namespace: demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: lab-store
  target:
    name: demo-app-all-keys
  dataFrom:
    - extract:
        key: prod/demo-app

# Bitnami NGINX chart (oci://registry-1.docker.io/bitnamicharts/nginx), tuned to show every
# availability feature we discussed. Each block says what it does and why.

# --- Images -------------------------------------------------------------------------------------
# Since 2025, Bitnami's free versioned images live in the frozen "bitnamilegacy" repository (no more
# security updates); docker.io/bitnami now carries Bitnami Secure Images. The chart verifies that
# images come from docker.io/bitnami/*, so swapping repositories requires allowInsecureImages.
# Fine for a lab. In production: mirror and scan images into your own registry, or pay for BSI.
global:
  security:
    allowInsecureImages: true
image:
  repository: bitnamilegacy/nginx
  tag: 1.29.1-debian-12-r0

# --- Capacity: explicit resources, no presets ------------------------------------------------------
# The HPA computes CPU utilisation as usage / request, so requests must be set. The low CPU request
# makes it easy to push NGINX over 50% with a small load generator on a laptop.
resourcesPreset: none
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# --- Scaling: HPA on CPU ------------------------------------------------------------------------
# With autoscaling enabled the chart omits spec.replicas, so the HPA owns the replica count.
autoscaling:
  enabled: true
  minReplicas: 3 # at least one per zone
  maxReplicas: 9
  targetCPU: 50 # percent of the CPU request

# --- Availability during maintenance: PodDisruptionBudget -----------------------------------------
# Voluntary evictions (kubectl drain, descheduler, cluster autoscaler scale-down) may never take the
# Deployment below 2 ready pods.
pdb:
  create: true
  minAvailable: 2

# --- Placement: spread across zones and nodes -----------------------------------------------------
# Turn off the chart's soft pod anti-affinity preset and use topology spread instead, which balances
# counts rather than only saying "not together".
podAntiAffinityPreset: ""
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway # soft: never leave a pod Pending just to keep balance
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/instance: web
    matchLabelKeys: ["pod-template-hash"] # only count pods of the same rollout
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/instance: web
    matchLabelKeys: ["pod-template-hash"]

# --- Graceful shutdown ----------------------------------------------------------------------------
# On termination, endpoint removal and SIGTERM happen in parallel. Sleeping first gives kube-proxy
# time to stop routing to this pod before NGINX exits, so rolling updates drop no requests.
terminationGracePeriodSeconds: 30
lifecycleHooks:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5"]

# --- Access without a load balancer ---------------------------------------------------------------
# The chart defaults to type LoadBalancer, which would sit at <pending> forever on kind.
# NodePort 30080 + the port mapping in kind-config.yaml = http://localhost:30080
service:
  type: NodePort
  nodePorts:
    http: "30080"

# --- Observability: stub_status + nginx-prometheus-exporter sidecar --------------------------------
# serviceMonitor stays off because this lab has no Prometheus; you read the exporter directly
# (see README step 3). In the gitops-lab you would set metrics.serviceMonitor.enabled: true.
metrics:
  enabled: true
  image:
    repository: bitnamilegacy/nginx-exporter
    tag: 1.4.2-debian-12-r9
  resourcesPreset: none
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi

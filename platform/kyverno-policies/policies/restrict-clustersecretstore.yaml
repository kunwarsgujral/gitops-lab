# Kyverno CEL policy type (policies.kyverno.io/v1, Kyverno 1.17+). The older kyverno.io ClusterPolicy
# kind is deprecated since Kyverno 1.19, and 1.20 blocks creating new ones, so this lab uses the CEL types.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-clustersecretstore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Only approved namespaces may use a ClusterSecretStore
    policies.kyverno.io/description: >-
      Anyone who can create an ExternalSecret against a shared ClusterSecretStore can read whatever
      that store's identity can read. Tenant namespaces must use their own namespaced SecretStore.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["externalsecrets"]
  matchConditions:
    # Platform namespaces plus the namespaces approved to use the shared store.
    - name: skip-approved-namespaces
      expression: "!(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease', 'local-path-storage', 'kyverno', 'argocd', 'external-secrets', 'monitoring', 'keda', 'reloader', 'demo'])"
  validations:
    # kind is optional and defaults to SecretStore, so a missing kind is allowed.
    - expression: >-
        !has(object.spec.secretStoreRef) ||
        !has(object.spec.secretStoreRef.kind) ||
        object.spec.secretStoreRef.kind == 'SecretStore'
      message: "Use a namespaced SecretStore; ClusterSecretStores are reserved for approved namespaces."

# Creates the K8s Secret "grafana-admin" in the monitoring namespace.
# kube-prometheus-stack reads it via grafana.admin.existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1m # short for the lab so rotation is visible; use 1h or more in real life
  secretStoreRef:
    kind: ClusterSecretStore
    name: lab-store
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: /grafana/admin-user
    - secretKey: admin-password
      remoteRef:
        key: /grafana/admin-password
